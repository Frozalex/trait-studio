name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # One shell everywhere: Git Bash on Windows runners, bash on Linux.
    shell: bash
jobs:
  unit:
    # Windows matches the release runner and exercises the Windows-only services;
    # Linux is a supported platform and must stay green on every change.
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Unit tests need neither the Electron binary nor Playwright browsers.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Tests that need the local Pivot corpus, generated inventories or built
      # encoders skip here and name the missing fixture; they run locally.
      - name: Syntax and changelog
        run: |
          npm run check
          npm run changelog:check
      - name: Application unit tests
        run: npm test
      - name: Codec service tests
        run: python -m unittest discover -s backend -p "test_*.py"

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - run: npm ci --no-audit --no-fund
      - name: Audit all npm dependencies, including the shipped Electron runtime
        run: |
          mkdir -p artifacts/security
          npm audit --audit-level=low --json > artifacts/security/npm-audit.json
      - name: Audit the Python build environment
        run: |
          python -m pip install -r scripts/requirements-build.txt pip-audit==2.10.1
          python -m pip_audit --local --progress-spinner off -f json -o artifacts/security/python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security
          path: artifacts/security
          retention-days: 30

  linux-app:
    # Builds the Linux app from source exactly as a release would, then boots it.
    name: Linux app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r scripts/requirements-build.txt
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Ubuntu 24.04 runners restrict unprivileged user namespaces, which
          # Chromium's sandbox needs; the app itself never disables the sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the native scanner, codec and video encoder
        run: |
          npm run build:frame-scan
          npm run build:sidecar
          npm run verify:sidecar
          npm run build:video-encoder
      - name: Package the AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:linux -- --x64 --publish never
          npm run verify:package
      - name: Boot the packaged app
        run: |
          xvfb-run -a npm run test:boot:packaged
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          STYK_PACKAGED_EXECUTABLE="$GITHUB_WORKSPACE/release/TraitStudio-$version-linux-x86_64.AppImage" xvfb-run -a npm run test:boot:packaged
      - name: Export video with the bundled encoder
        run: xvfb-run -a npm run test:export:packaged
      - name: Upload the build evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml
            artifacts/sidecar-smoke.json
            artifacts/package-manifest.json
            artifacts/trait-video-exports.json
          retention-days: 7

  windows-app:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r scripts/requirements-build.txt
      - name: Build native scanner, codecs and encoder
        run: |
          npm run build:frame-scan
          npm run build:vfw
          npm run build:sidecar
          npm run verify:sidecar
          npm run build:video-encoder
      - name: Package and verify Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:win -- --x64 --publish never
          npm run verify:package
          npm run release:verify -- release --platform=win32
          npm run test:boot:packaged
          npm run test:export:packaged
          node scripts/verify-trait-install.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            artifacts/package-manifest.json
            artifacts/sidecar-smoke.json
            artifacts/trait-video-exports.json
            artifacts/trait-windows-install.json
          retention-days: 14
          if-no-files-found: error

  antivirus:
    name: Distribution antivirus
    needs: [linux-app, windows-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: scan
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop
          path: scan
      - name: Prepare scanner and current signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam p7zip-full
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          mkdir -p artifacts/security
          clamscan --version | tee artifacts/security/antivirus-version.txt
      - name: Extract the exact built payloads
        run: |
          appimage=$(find scan/release -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          (cd scan && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
          setup=$(find scan/release -maxdepth 1 -name '*Setup*.exe' -print -quit)
          7z x "$setup" -oscan/installer '$PLUGINSDIR/app-64.7z'
          7z x 'scan/installer/$PLUGINSDIR/app-64.7z' -oscan/windows-app
      - name: Scan binaries and extracted application files
        run: |
          clamscan --recursive --infected --max-filesize=512M --max-scansize=2048M --max-files=100000 --log=artifacts/security/antivirus-scan.txt scan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-antivirus
          path: artifacts/security
          retention-days: 30
